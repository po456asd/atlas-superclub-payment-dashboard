<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ATLAS Superclub Bangkok — Construction Payment Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#0f0f0f;
    --bg-1:#191919;
    --bg-2:#222220;
    --line:#36312a;
    --gold:#d4b07a;
    --gold-bright:#f0d895;
    --gold-dim:#9d8a5e;
    --text:#f5f2eb;
    --muted:#a39d8f;
    --danger:#c96a5a;
    --good:#7fae78;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg-0);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh}
  body{
    background:
      radial-gradient(ellipse at top, rgba(201,169,97,0.08), transparent 50%),
      radial-gradient(ellipse at bottom, rgba(201,169,97,0.04), transparent 60%),
      var(--bg-0);
  }
  .container{max-width:1400px;margin:0 auto;padding:32px 24px}

  /* Header */
  header{
    border-bottom:1px solid var(--line);
    padding-bottom:20px;
    margin-bottom:32px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    flex-wrap:wrap;
    gap:16px;
  }
  .brand{display:flex;align-items:center;gap:16px}
  .brand-text h1{
    font-family:'Cormorant Garamond',serif;
    font-size:24px;font-weight:500;letter-spacing:2px;
    text-transform:uppercase;
  }
  .brand-text h1 span{color:var(--gold)}
  .brand-text p{
    font-size:10px;letter-spacing:3px;
    text-transform:uppercase;color:var(--muted);margin-top:2px;
  }
  .meta{text-align:right;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
  .meta span{color:var(--gold);font-weight:500;display:block;margin-top:2px;letter-spacing:1px;text-transform:capitalize}
  .meta strong{color:var(--gold);font-weight:500;display:block;margin-top:2px;letter-spacing:2px}

  /* Summary cards */
  .summary{
    display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;
  }
  .card{
    background:linear-gradient(135deg,var(--bg-2),var(--bg-1));
    border:1px solid var(--line);
    padding:12px 10px;
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:'';position:absolute;top:0;left:0;right:0;height:1px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
    opacity:0.6;
  }
  .card-label{
    font-size:8px;letter-spacing:1px;text-transform:uppercase;
    color:var(--muted);margin-bottom:4px;
  }
  .card-value{
    font-family:'Inter',sans-serif;
    font-size:20px;font-weight:600;color:var(--gold-bright);
    letter-spacing:0;
  }
  .card-sub{
    font-size:10px;color:var(--muted);margin-top:6px;letter-spacing:1px;
  }
  .card.accent .card-value{color:var(--text)}

  /* Section title */
  .section-title{
    display:flex;align-items:center;gap:12px;margin-bottom:24px;
  }
  .section-title::before,.section-title::after{
    content:'';flex:0 0 40px;height:1px;background:var(--gold-dim);
  }
  .section-title::after{flex:1}
  .section-title h2{
    font-family:'Cormorant Garamond',serif;
    font-size:18px;font-weight:500;letter-spacing:3px;
    text-transform:uppercase;color:var(--gold);
  }

  /* Contractor block */
  .contractor{
    border:1px solid var(--line);
    margin-bottom:18px;
    background:linear-gradient(180deg,rgba(26,23,19,0.6),rgba(17,17,17,0.6));
  }
  .contractor-head{
    padding:18px 24px;
    display:flex;justify-content:space-between;align-items:center;
    border-bottom:1px solid var(--line);
    background:linear-gradient(90deg,rgba(201,169,97,0.05),transparent);
    flex-wrap:wrap;gap:12px;
  }
  .contractor-name{
    font-family:'Cormorant Garamond',serif;
    font-size:20px;font-weight:600;color:var(--gold-bright);
    letter-spacing:1.5px;
  }
  .contractor-name small{
    display:block;font-family:'Inter',sans-serif;
    font-size:9px;color:var(--muted);letter-spacing:2px;
    text-transform:uppercase;margin-top:3px;font-weight:400;
  }
  .contractor-totals{display:flex;gap:24px;flex-wrap:wrap}
  .total-item{text-align:right}
  .total-item .lbl{
    font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);
  }
  .total-item .val{
    font-family:'Inter',sans-serif;
    font-size:15px;font-weight:600;color:var(--gold);margin-top:2px;
  }
  .total-item .val.remain{color:var(--text)}

  /* Contracts table */
  table{width:100%;border-collapse:collapse}
  thead th{
    font-size:9px;letter-spacing:2px;text-transform:uppercase;
    color:var(--gold-dim);font-weight:500;
    padding:12px 20px;text-align:left;
    border-bottom:1px solid var(--line);
    background:rgba(0,0,0,0.2);
  }
  thead th.num{text-align:right}
  tbody td{
    padding:14px 20px;
    border-bottom:1px solid rgba(42,38,33,0.6);
    font-size:13px;
  }
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:rgba(201,169,97,0.03)}
  td.contract-name{font-weight:500;font-size:12px}
  td.contract-name small{
    display:block;color:var(--muted);font-size:10px;
    font-weight:400;margin-top:1px;letter-spacing:0.5px;
  }
  td.num{
    text-align:right;
    font-family:'Inter',sans-serif;
    font-size:13px;font-weight:500;letter-spacing:0;
    white-space:nowrap;
  }
  td.num.paid{color:var(--gold)}
  td.num.remain{color:var(--text)}
  td.num.total{color:var(--gold-bright)}

  /* Progress bar */
  .progress-wrap{
    display:flex;align-items:center;gap:12px;min-width:160px;
  }
  .progress{
    flex:1;height:4px;background:rgba(201,169,97,0.12);
    position:relative;overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg,var(--gold-dim),var(--gold-bright));
    box-shadow:0 0 8px rgba(201,169,97,0.4);
  }
  .progress-pct{
    font-size:11px;color:var(--gold);letter-spacing:1px;min-width:36px;text-align:right;
  }

  /* Payment Evidence Modal */
  .modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);z-index:1000;align-items:center;justify-content:center}
  .modal.active{display:flex}
  .modal-content{background:var(--bg-1);border:1px solid var(--line);max-width:90%;max-height:90%;overflow:auto;position:relative}
  .modal-close{position:absolute;top:12px;right:16px;background:none;border:none;color:var(--gold);font-size:24px;cursor:pointer;padding:0;width:32px;height:32px;display:flex;align-items:center;justify-content:center}
  .modal-close:hover{color:var(--gold-bright)}
  .modal-body{padding:24px}
  .modal-body img{max-width:100%;height:auto;display:block;margin:0 auto}
  .modal-body .info{margin-top:16px;font-size:12px;color:var(--muted);line-height:1.6}
  .modal-body .info strong{color:var(--text);font-weight:600}

  /* Payment Summary */
  .payment-summary{
    background:linear-gradient(135deg,rgba(201,169,97,0.1),rgba(201,169,97,0.05));
    border:1px solid var(--gold-dim);
    border-radius:2px;
    padding:24px;
    margin-bottom:24px;
  }
  .payment-summary h3{
    font-family:'Cormorant Garamond',serif;
    font-size:18px;font-weight:500;letter-spacing:2px;
    text-transform:uppercase;color:var(--gold);margin-bottom:20px;
  }
  .payment-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
  .payment-item{display:flex;flex-direction:column;align-items:center;text-align:center}
  .payment-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
  .payment-value{font-family:'Inter',sans-serif;font-size:18px;font-weight:600;color:var(--gold-bright)}
  .payment-item.deficit .payment-value{color:#d67a6a}
  .payment-item.surplus .payment-value{color:#7fae78}
  .payment-percent{font-size:12px;color:var(--muted);margin-top:4px}
  .evidence-btn{
    background:var(--gold-dim);color:var(--text);border:1px solid var(--gold);padding:10px 16px;
    font-size:12px;font-weight:500;letter-spacing:1px;text-transform:uppercase;
    cursor:pointer;transition:0.2s;display:inline-block;white-space:nowrap;
  }
  .evidence-btn:hover{background:var(--gold);color:var(--bg-0)}

  /* Footer */
  footer{
    margin-top:40px;padding-top:20px;border-top:1px solid var(--line);
    text-align:center;font-size:9px;letter-spacing:2px;
    text-transform:uppercase;color:var(--muted);
  }
  footer span{color:var(--gold)}

  @media (max-width:900px){
    .summary{grid-template-columns:repeat(2,1fr)}
    .contractor-head{flex-direction:column;align-items:flex-start}
    .contractor-totals{width:100%;justify-content:space-between;gap:12px}
    .total-item{text-align:left}
    thead{display:none}
    tbody td{display:block;padding:6px 18px;border:none;text-align:left !important}
    tbody tr{display:block;padding:12px 0;border-bottom:1px solid var(--line)}
    td.num::before{
      content:attr(data-label);
      display:inline-block;min-width:100px;
      font-family:'Inter',sans-serif;font-size:9px;
      letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);
    }
  }

  .summary-tabs{display:flex;gap:0;margin-bottom:20px;border-bottom:1px solid var(--gold-dim)}
  .summary-tab{background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-family:'Cormorant Garamond',serif;font-size:13px;letter-spacing:2px;text-transform:uppercase;padding:8px 20px;cursor:pointer;margin-bottom:-1px;transition:0.2s}
  .summary-tab.active{color:var(--gold);border-bottom-color:var(--gold)}
  .summary-tab-content{display:none}
  .summary-tab-content.active{display:block}

  /* Print styles */
  @media print {
    * { margin:0; padding:0; }
    html, body { margin:0; padding:0; width:100%; height:auto; background:white !important; }
    .container { max-width:100%; padding:20mm; background:white; }
    body { background:white !important; }

    /* Hide interactive elements */
    button, .evidence-btn, .summary-tabs, .pdfModal, .evidenceModal { display:none !important; }

    /* Typography for print */
    * { color:black !important; background:white !important; }
    header, .section-title, h1, h2, h3 { color:#000 !important; }

    /* Cards and summary */
    .card { border:1px solid #999 !important; background:white !important; page-break-inside:avoid; }
    .summary { page-break-inside:avoid; }

    /* Tables */
    table { width:100%; border-collapse:collapse; page-break-inside:avoid; margin-bottom:20px; }
    thead { display:table-header-group; }
    tbody { display:table-row-group; }
    tr { page-break-inside:avoid; page-break-after:auto; }
    th, td {
      border:1px solid #999 !important;
      padding:8px !important;
      text-align:left;
      color:black !important;
      background:white !important;
      font-size:11px;
    }
    th {
      background:#f5f5f5 !important;
      font-weight:bold !important;
      color:black !important;
    }

    /* Contractors */
    .contractor { page-break-inside:avoid; margin-bottom:20px; border:1px solid #999; }
    .contractor-head { page-break-inside:avoid; }

    /* Section titles */
    .section-title { color:black !important; margin-bottom:15px; }
    .section-title::before, .section-title::after { background:#999 !important; }

    /* Payment summary */
    .payment-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; page-break-inside:avoid; }
    .payment-item { border:1px solid #999 !important; padding:10px !important; background:white !important; page-break-inside:avoid; }
    .payment-label { font-size:10px; color:#666 !important; }
    .payment-value { font-size:16px; font-weight:bold; color:black !important; }

    /* Progress bars - solid in print */
    div[style*="height:100%"][style*="width:"] { background:#333 !important; }

    /* Remove gradients */
    div { background-image:none !important; }

    /* Ensure text visibility */
    body { color:black !important; }
    a { color:black !important; text-decoration:none; }

    /* Page breaks */
    header { page-break-after:avoid; }
    #contractors { page-break-before:auto; }

    /* Footer */
    footer { page-break-inside:avoid; }

    /* Modal hide */
    #pdfModal, #evidenceModal { display:none !important; }
  }
  </style>
</head>
<body>
<div class="container">

  <header>
    <div class="brand">
      <div class="brand-text">
        <h1>Atlas <span>Superclub</span></h1>
        <p>Bangkok · Construction Payment Dashboard</p>
      </div>
    </div>
    <div class="meta">
      Report Issued by <span>Pratchaya Seela</span>
      <div id="updateInfo" style="font-size:10px;color:var(--muted);margin-top:2px;letter-spacing:0.5px"></div>
      <button onclick="exportPDF()" style="margin-top:12px;padding:8px 16px;background:var(--gold);color:#000;border:none;border-radius:4px;cursor:pointer;font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;transition:0.2s">📥 Export PDF</button>
      <button onclick="exportExcel()" style="margin-top:12px;margin-left:8px;padding:8px 16px;background:var(--gold);color:#000;border:none;border-radius:4px;cursor:pointer;font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;transition:0.2s">📊 Export Excel</button>
    </div>
  </header>

  <!-- Payment Summary -->
  <div class="payment-summary" id="paymentSummary"></div>

  <!-- Evidence Modal -->
  <div class="modal" id="evidenceModal" onclick="if(event.target===this)closeEvidenceModal()">
    <div class="modal-content">
      <button class="modal-close" onclick="closeEvidenceModal()">&times;</button>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- PDF Viewer Modal -->
  <div id="pdfModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:2000;align-items:center;justify-content:center" onclick="if(event.target===this)closePDF()">
    <div style="position:relative;width:90vw;height:92vh;background:#1a1a1a;border:1px solid rgba(201,169,97,0.3);display:flex;flex-direction:column">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid rgba(201,169,97,0.2);flex-shrink:0">
        <span id="pdfTitle" style="color:var(--gold);font-family:var(--font-head);font-size:12px;letter-spacing:1.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:70%"></span>
        <div style="display:flex;gap:10px;flex-shrink:0">
          <a id="pdfDownload" href="#" download style="color:var(--gold);background:rgba(201,169,97,0.1);border:1px solid rgba(201,169,97,0.35);padding:5px 14px;font-size:11px;letter-spacing:1px;text-decoration:none;cursor:pointer">⬇ DOWNLOAD</a>
          <button onclick="closePDF()" style="background:none;border:1px solid rgba(201,169,97,0.35);color:var(--gold);font-size:18px;width:32px;height:32px;cursor:pointer;line-height:1">&times;</button>
        </div>
      </div>
      <iframe id="pdfFrame" src="" style="flex:1;border:none;width:100%"></iframe>
    </div>
  </div>
  <!-- Contractors -->
  <div class="section-title"><h2>Contractors &amp; Contracts</h2></div>
  <section id="contractors"></section>

  <footer>
    Prepared by <span>CMP Management Asia co.,Ltd.</span> &middot; Confidential
  </footer>
</div>

<script>
  // Data structure — amounts in THB (Thai Baht)
  // Set update time and build ID
  const now = new Date();
  const buildId = "v" + now.toISOString().substr(0,10).replace(/-/g,"");

  // Display build ID only
  document.getElementById("updateInfo").innerHTML = `Build: ${buildId}`;

  let data = [];

  const fmt = n => "฿ " + (Number(n)||0).toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:2});
  const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');

  // PDF asset resolver — pass-through for now, single remap point if folder layout changes
  function resolvePdfUrl(contractorRef, pdfUrl) { return pdfUrl; }

  function summarize(data, payments) {
    const byRef = {};
    payments.forEach(p => { byRef[p.contractorRef] = (byRef[p.contractorRef] || 0) + p.amount; });
    const perContractor = data.map(c => {
      if (c.retention_only) {
        return Object.assign({}, c, { cTotal:0, cPaid:byRef[c.ref]||0, cRem:-(byRef[c.ref]||0), pct:0, isOverpaid:(byRef[c.ref]||0)>0 });
      }
      const cTotal = c.contracts.reduce((a,b) => a + (b.grandTotal || 0), 0);
      const cPaid = byRef[c.ref] || 0;
      return Object.assign({}, c, { cTotal, cPaid, cRem:cTotal-cPaid, pct:cTotal>0?(cPaid/cTotal*100):0, isOverpaid:cPaid>cTotal });
    });
    const grandTotals = {
      totalClaims: perContractor.reduce((s,c) => s + (c.retention_only ? 0 : c.cTotal), 0),
      totalPaid: perContractor.reduce((s,c) => s + c.cPaid, 0),
      totalRetention: data.reduce((s,c) => s + (c.retention_total || 0), 0)
    };
    grandTotals.balance = grandTotals.totalClaims - grandTotals.totalPaid;
    return { perContractor, grandTotals };
  }

  async function loadData() {
    try {
      const [d, p] = await Promise.all([
        fetch('data/contractors.json').then(r => r.json()),
        fetch('data/payments.json').then(r => r.json())
      ]);
      data = d;
      payments = p;

      // Match payments to contracts
      const paymentsByContractor = {};
      payments.forEach(p => {
        if (!paymentsByContractor[p.contractorRef]) {
          paymentsByContractor[p.contractorRef] = [];
        }
        paymentsByContractor[p.contractorRef].push(p);
      });

      data.forEach(contractor => {
        const contractorPayments = paymentsByContractor[contractor.ref] || [];
        if (contractorPayments.length === 0) return;

        // Skip payment matching for XTI (uses manual paid amounts)
        if (contractor.ref === "CT-XTI") return;

        // Sort contracts by grand total (cheapest first)
        const sortedContracts = [...contractor.contracts].sort((a, b) => a.grandTotal - b.grandTotal);

        // Track which contracts have been matched
        const matchedContracts = new Set();
        const unmatchedPayments = [];

        // First pass: try to match exact amounts to contract grand totals
        contractorPayments.forEach(payment => {
          let found = false;
          for (let j = 0; j < sortedContracts.length; j++) {
            const contract = sortedContracts[j];
            if (matchedContracts.has(j)) continue;

            if (Math.abs(payment.amount - contract.grandTotal) < 0.01) {
              contract.paid = payment.amount;
              matchedContracts.add(j);
              found = true;
              break;
            }
          }
          if (!found) {
            unmatchedPayments.push(payment);
          }
        });

        // Second pass: allocate lump sum payments from cheapest to most expensive
        let remainingPayment = unmatchedPayments.reduce((sum, p) => sum + p.amount, 0);

        for (let j = 0; j < sortedContracts.length; j++) {
          if (matchedContracts.has(j)) continue; // Already matched

          const contract = sortedContracts[j];
          const currentPaid = contract.paid || 0;
          const unpaid = contract.grandTotal - currentPaid;
          const canPay = Math.min(remainingPayment, unpaid);

          contract.paid = currentPaid + canPay;
          remainingPayment -= canPay;

          if (remainingPayment <= 0) break;
        }
      });

      // Summary
      let gTotal=0;
      data.forEach(c=>{
        if(c.retention_only) return;
        c.contracts.forEach(k=>{ gTotal += k.grandTotal; });
      });

      // Calculate total received from payments (filter by active contractors only)
      const activeContractorRefs = new Set(data.filter(d => !d.retention_only).map(d => d.ref));
      let totalReceived = 0;
      payments.forEach(p => {
        if(activeContractorRefs.has(p.contractorRef)) totalReceived += p.amount;
      });
      const totalClaims = gTotal;
      const balance = totalReceived - totalClaims;
      const balancePct = totalClaims ? (totalReceived/totalClaims*100) : 0;
      const balanceStatus = balance >= 0 ? "surplus" : "deficit";

      // Render Payment Summary
      const paymentSummaryHost = document.getElementById("paymentSummary");
      let evidenceBtn = `<button class="evidence-btn" onclick="showEvidencePicker()">📄 View Payment Evidence</button>`;
      const balanceIsComplete = Math.round(balancePct) === 100;
      const balanceBarColor = balancePct > 100 ? '#cc2222' : (balanceIsComplete ? '#22aa22' : '#888888');

      paymentSummaryHost.innerHTML = `
        <h3>Payment Received Summary</h3>
        <div class="summary-tabs">
          <button class="summary-tab active" onclick="switchSummaryTab('payment',this)">Payment</button>
          <button class="summary-tab" onclick="switchSummaryTab('retention',this)">Retention</button>
        </div>
        <div id="summaryTab-payment" class="summary-tab-content active">
        <div class="payment-grid">
          <div class="payment-item">
            <div class="payment-label">Total Claims Value</div>
            <div class="payment-value">${fmt(totalClaims)}</div>
          </div>
          <div class="payment-item">
            <div class="payment-label">Total Received</div>
            <div class="payment-value">${fmt(totalReceived)}</div>
          </div>
          <div class="payment-item ${balanceStatus}">
            <div class="payment-label">${balance >= 0 ? "Surplus" : "Deficit"}</div>
            <div class="payment-value">${fmt(Math.abs(balance))}</div>
            <div class="payment-percent">${balancePct.toFixed(2)}% of total</div>
          </div>
          <div class="payment-item" style="justify-content:center">
            <div class="payment-label">Overall Paid</div>
            <div class="payment-value">${balancePct.toFixed(1)}%</div>
            <div style="width:100%;margin-top:10px">
              <div class="c-bar-track" style="height:8px;background:#fff;border:1px solid #999;overflow:hidden;border-radius:1px">
                <div class="c-bar-fill" style="height:100%;width:${Math.min(100,balancePct)}%;background:${balanceBarColor};border-radius:0;transition:width 0.6s ease"></div>
              </div>
              <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--muted);margin-top:4px;letter-spacing:1px">
                <span>0%</span><span>50%</span><span>100%</span>
              </div>
            </div>
            <div style="margin-top:10px">${evidenceBtn}</div>
          </div>
        </div>
        </div>
        <div id="summaryTab-retention" class="summary-tab-content">
          <div class="payment-grid" id="retentionSummaryGrid" style="margin-bottom:0"></div>
        </div>
      `;



      renderDashboard();
    } catch(e) {
      console.error('Failed to load data:', e);
      const host = document.getElementById("paymentSummary");
      if(host) host.innerHTML = '<p style="color:#ff4444;text-align:center;padding:40px;font-family:var(--font-head);letter-spacing:2px">FAILED TO LOAD DATA — check console</p>';
    }
  }

  // Payment received data (linked to contractor ref)
  let payments = [];

  // Modal functions
  window.showPDF = function(url, name){
    const modal = document.getElementById('pdfModal');
    document.getElementById('pdfFrame').src = url;
    document.getElementById('pdfTitle').textContent = name || url;
    document.getElementById('pdfDownload').href = url;
    document.getElementById('pdfDownload').download = url.split('/').pop();
    modal.style.display = 'flex';
  };
  window.closePDF = function(){
    document.getElementById('pdfModal').style.display = 'none';
    document.getElementById('pdfFrame').src = '';
  };
  // Close PDF modal on Escape key
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && document.getElementById('pdfModal').style.display === 'flex'){
      closePDF();
    }
  });
  let _savedContractorsHTML = null;
  window.switchSummaryTab = function(tabId, btn){
    document.querySelectorAll('.summary-tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.summary-tab-content').forEach(t=>t.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('summaryTab-'+tabId).classList.add('active');

    // Change header based on selected tab
    const headerEl = document.querySelector('#paymentSummary h3');
    if(tabId === 'retention'){
      headerEl.textContent = 'Retention Summary';
    } else {
      headerEl.textContent = 'Payment Received Summary';
    }

    const host = document.getElementById('contractors');
    if(tabId === 'retention'){
      // Populate retention summary grid using lump sum retention_total
      const retGrid = document.getElementById('retentionSummaryGrid');
      const retractorsWithRetention = data.filter(d=>d.retention_total>0);
      const gTotalRet = retractorsWithRetention.reduce((s,d)=>s+d.retention_total,0);
      const retItems = retractorsWithRetention.map(d=>{
        return `<div class="payment-item"><div class="payment-label">${d.contractor}</div><div class="payment-value" style="font-size:15px">${fmt(d.retention_total)}</div></div>`;
      }).join('');
      retGrid.innerHTML = retItems + `<div class="payment-item"><div class="payment-label" style="color:var(--gold)">Total Retention</div><div class="payment-value">${fmt(gTotalRet)}</div></div>`;
      _savedContractorsHTML = host.innerHTML;
      let html = '';
      retractorsWithRetention.forEach(c=>{
        const pdfBtn = c.retention_memo ? `<button class="evidence-btn" onclick="window.showPDF('${esc(resolvePdfUrl(c.ref, c.retention_memo))}','${esc(c.contractor)} - Retention Memo')">📄 View Retention Memo</button>` : '';
        html += `<div class="contractor">
          <div class="contractor-head" style="flex-wrap:wrap">
            <div style="flex:1;min-width:300px">
              <div class="contractor-name">${c.contractor}<small>${c.ref}</small></div>
              <div class="contractor-totals" style="margin-top:12px">
                <div class="total-item"><div class="lbl">Retention Amount</div><div class="val" style="color:#d4a843">${fmt(c.retention_total)}</div></div>
              </div>
            </div>
            <div style="flex-shrink:0">
              ${pdfBtn}
            </div>
          </div>
        </div>`;
      });
      host.innerHTML = html || '<p style="color:var(--muted);text-align:center;padding:40px">No retention data entered yet</p>';
    } else {
      if(_savedContractorsHTML) host.innerHTML = _savedContractorsHTML;
    }
  };
  window.closeEvidenceModal = function(){
    document.getElementById("evidenceModal").classList.remove("active");
  };

  window.showEvidencePicker = function(contractorRef){
    const modalBody = document.getElementById("modalBody");
    let filtered = contractorRef ? payments.filter(p => p.contractorRef === contractorRef) : payments;
    filtered = filtered.sort((a, b) => {
      const contA = data.find(d => d.ref === a.contractorRef)?.contractor || a.contractorRef;
      const contB = data.find(d => d.ref === b.contractorRef)?.contractor || b.contractorRef;
      const nameCompare = contA.localeCompare(contB);
      if(nameCompare !== 0) return nameCompare;
      return new Date(a.date) - new Date(b.date);
    });
    const listHTML = filtered.map((p, idx) => {
      const c2 = data.find(d => d.ref === p.contractorRef);
      return `<button class="evidence-btn" style="width:100%;margin:4px 0;text-align:left;display:flex;justify-content:space-between;gap:12px" onclick="window.showEvidence('${esc(p.contractorRef)}',${idx},${contractorRef ? 'true' : 'false'})"><span>📄 ${esc(c2?.contractor || p.contractorRef)}</span><span style="opacity:0.7;font-size:11px">${fmt(p.amount)} · ${esc(p.date)}</span></button>`;
    }).join("");
    const title = contractorRef ? `SELECT PAYMENT - ${esc(data.find(d => d.ref === contractorRef)?.contractor)}` : `SELECT PAYMENT EVIDENCE`;
    modalBody.innerHTML = `<div style="padding:4px"><div style="color:var(--gold);font-family:var(--font-head);font-size:14px;letter-spacing:2px;margin-bottom:16px;text-align:center">${esc(title)}</div>${listHTML}</div>`;
    document.getElementById("evidenceModal").classList.add("active");
  };

  window.showEvidence = function(contractorRef, paymentIdx, isFiltered){
    const filtered = isFiltered ? payments.filter(p => p.contractorRef === contractorRef) : payments;
    const p = filtered[paymentIdx];
    if(!p) return;
    const contractor = data.find(d => d.ref === contractorRef);
    const modalBody = document.getElementById("modalBody");
    const backBtn = isFiltered ? `<button class="evidence-btn" onclick="window.showEvidencePicker('${esc(contractorRef)}')" style="margin-bottom:16px;width:100%">← Back to Payments</button>` : "";
    modalBody.innerHTML = `
      ${backBtn}
      <img src="${p.evidence.image}" alt="Payment Evidence" style="max-height:600px">
      <div class="info">
        <strong>Contractor:</strong> ${esc(contractor?.contractor ?? p.contractorRef)}<br>
        <strong>Payment Date:</strong> ${esc(p.date)}<br>
        <strong>Amount Received:</strong> ${fmt(p.amount)}<br>
        <strong>Bank:</strong> ${esc(p.evidence.bankName)}<br>
        <strong>Cheque No:</strong> ${esc(p.evidence.chequeNo)}
      </div>
    `;
    document.getElementById("evidenceModal").classList.add("active");
  };


function renderDashboard() {
  // Contractors
  const host = document.getElementById("contractors");
  const { perContractor } = summarize(data, payments);
  perContractor.forEach(c=>{
    if(c.retention_only) return; // Skip retention-only contractors in payment tab
    const { cTotal, cPaid, cRem, pct, isOverpaid } = c;

    const overpaidBadge = isOverpaid ? ` <span style="color:#ff4444;font-size:10px;font-weight:700;letter-spacing:1.5px;vertical-align:middle;background:rgba(255,68,68,0.1);padding:2px 8px;border:1px solid rgba(255,68,68,0.35);margin-left:8px">OVERPAID</span>` : "";
    const paidPct = pct;
    const isComplete = Math.round(paidPct) === 100;
    const barColor = isOverpaid ? "#cc2222" : (isComplete ? "#22aa22" : "#888888");
    const pctColor = isOverpaid ? "#ff4444" : "var(--gold)";
    const remColor = isOverpaid ? "color:#ff4444" : "";

    // Check if this contractor has a payment received
    const contractorPayment = payments.find(p => p.contractorRef === c.ref);
    const evidenceHTML = contractorPayment ? `<button class="evidence-btn" onclick="showEvidencePicker('${c.ref}')" style="margin-left:16px">📄 View Payment Evidence</button>` : "";

    const rows = c.contracts.map(k=>{
      const rem = k.grandTotal - (k.paid || 0);
      return `
        <tr>
          <td class="contract-name">${esc(k.no)}<small>${esc(k.subject)}</small></td>
          <td class="contract-name">${esc(k.name)}<small>${esc(k.ref)}</small></td>
          <td class="num total" data-label="A Before VAT">${fmt(k.beforeVat)}</td>
          <td class="num paid" data-label="B Retention">${fmt(k.retention)}</td>
          <td class="num paid" data-label="C VAT">${fmt(k.vat)}</td>
          <td class="num" data-label="D Sub Total">${fmt(k.subTotal)}</td>
          <td class="num" data-label="E W/H Tax">${fmt(k.whTax)}</td>
          <td class="num total" data-label="F Grand Total">${fmt(k.grandTotal)}</td>
          <td class="num paid" data-label="G Paid">${fmt(k.paid || 0)}</td>
          <td class="num" data-label="H Remaining">${fmt((k.grandTotal || 0) - (k.paid || 0))}</td>
          <td style="text-align:center">${k.pdfUrl ? `<button onclick="showPDF('${resolvePdfUrl(c.ref, k.pdfUrl)}','${k.name}')" title="View PDF" style="background:none;border:none;cursor:pointer;color:var(--gold);font-size:16px;padding:0">📄</button>` : `<span style="color:rgba(201,169,97,0.2);font-size:12px">—</span>`}</td>
        </tr>`;
    }).join("");

    host.insertAdjacentHTML("beforeend",`
      <div class="contractor">
        <div class="contractor-head" style="flex-wrap:wrap">
          <div style="flex:1;min-width:300px">
            <div class="contractor-name">${c.contractor}${overpaidBadge}<small>${c.ref} · ${c.contracts.length} Claim${c.contracts.length>1?'s':''}</small></div>
            <div class="contractor-totals" style="margin-top:12px">
              <div class="total-item"><div class="lbl">Total Claims</div><div class="val">${fmt(cTotal)}</div></div>
              <div class="total-item"><div class="lbl">Paid</div><div class="val">${fmt(cPaid)}</div></div>
              <div class="total-item"><div class="lbl">Remaining</div><div class="val remain" style="${remColor}">${fmt(cRem)}</div></div>
              <div class="total-item" style="min-width:180px">
                <div class="lbl">Payment Progress</div>
                <div style="display:flex;align-items:center;gap:8px;margin-top:6px">
                  <div class="c-bar-track" style="flex:1;height:6px;background:#fff;border:1px solid #999;overflow:hidden;border-radius:1px">
                    <div class="c-bar-fill" style="height:100%;width:${(cTotal > 0) ? Math.min(100,Math.max(0,(cPaid/cTotal*100))) : 0}%;background:${barColor};border-radius:0;transition:width 0.6s ease"></div>
                  </div>
                  <span class="c-bar-pct" style="font-size:11px;color:${pctColor};white-space:nowrap;min-width:38px;text-align:right">${(cTotal > 0) ? (cPaid/cTotal*100).toFixed(1) : '0.0'}%</span>
                </div>
              </div>
            </div>
          </div>
          ${evidenceHTML}
        </div>
        <table>
          <thead>
            <tr>
              <th>No</th>
              <th>Payment Claim & Reference</th>
              <th class="num">A Before VAT</th>
              <th class="num">B Retention</th>
              <th class="num">C VAT</th>
              <th class="num">D Sub Total</th>
              <th class="num">E W/H Tax</th>
              <th class="num">F Grand Total</th>
              <th class="num">G Paid</th>
              <th class="num">H Remaining</th>
              <th style="width:40px;text-align:center">PDF</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    `);
  });

  // PDF Export function
  window.exportPDF = function(){
    const element = document.querySelector('.container');

    // Darken text and shrink tables for PDF export
    const style = document.createElement('style');
    style.textContent = `
      html, body, .container { background: #f5f5f5 !important; }
      .container { background: #f5f5f5 !important; }
      .container * { color: #000 !important; background: transparent !important; }
      .card { background: #ffffff !important; border: 1px solid #ddd !important; }
      .payment-grid { background: transparent !important; }
      .payment-item { background: #ffffff !important; border: 1px solid #ddd !important; }
      .contractor { background: transparent !important; }
      .contractor-head { background: #f0f0f0 !important; }
      .payment-label, .card-label, .section-title::before { color: #333 !important; }
      table { color: #000 !important; font-size: 9px !important; background: #fff !important; }
      thead { background: #e8e8e8 !important; }
      th, td { color: #000 !important; font-size: 9px !important; padding: 4px 2px !important; background: #fff !important; border-color: #ccc !important; }
      .contractor-name { font-size: 11px !important; }
      .payment-value { font-size: 12px !important; }
      .contractor-head { padding: 6px !important; }
      button.evidence-btn, button[onclick*="exportPDF"], button[onclick*="exportExcel"] { display: none !important; }
      .progress, .c-bar-track { background: #ddd !important; }
      .progress-fill, .c-bar-fill { background: #222 !important; box-shadow: none !important; }
      .progress-pct, .c-bar-pct { color: #000 !important; }
    `;
    document.head.appendChild(style);

    // Get current active tab for filename suffix
    const activeTabBtn = document.querySelector('.summary-tab.active');
    const currentTab = (activeTabBtn?.textContent?.trim() || 'Payment').replace(/[^A-Za-z0-9_-]/g, '');
    const capitalizedTab = currentTab.charAt(0).toUpperCase() + currentTab.slice(1);

    const opt = {
      margin: [8, 6, 8, 6],
      filename: `ATLAS_Superclub_${capitalizedTab}_Dashboard.pdf`,
      image: { type: 'jpeg', quality: 0.95 },
      html2canvas: { scale: 1.2, useCORS: true, logging: false, windowHeight: 1400, allowTaint: true },
      jsPDF: { orientation: 'landscape', unit: 'mm', format: 'a4' },
      pagebreak: { avoid: ['.contractor', '.card', '.summary', 'table'], mode: ['avoid-all', 'css', 'legacy'] }
    };
    html2pdf().set(opt).from(element).save().then(() => {
      document.head.removeChild(style);
    });
  };

  // Excel Export function
  window.exportExcel = function(){
    const { perContractor, grandTotals } = summarize(data, payments);
    const totalClaims = grandTotals.totalClaims;
    const totalReceived = grandTotals.totalPaid;
    const balance = grandTotals.balance;
    const balancePct = totalClaims > 0 ? (totalReceived / totalClaims * 100) : 0;

    // Create workbook
    const wb = XLSX.utils.book_new();

    // ========== SHEET 1: PAYMENT RECEIVED SUMMARY ==========
    const paymentData = [];

    // Row 1: Title
    paymentData.push(['', 'PAYMENT RECEIVED SUMMARY']);

    // Row 2: Summary headers
    paymentData.push(['', 'Total Claims Value', 'Total Received', 'Remaining']);

    // Row 3: Summary values
    paymentData.push(['', totalClaims, totalReceived, balance]);

    // Row 4: Empty
    paymentData.push([]);

    // Row 5: Table headers
    paymentData.push(['No', 'Payment Claim & Reference', 'A Before VAT', 'B Retention', 'C VAT', 'D Sub Total', 'E W/H Tax', 'F Grand Total', 'G Paid', 'H Remaining']);

    // Row 6: Empty row
    paymentData.push([]);

    // Add contractors and contracts
    data.forEach(d => {
      if(d.retention_only) return;

      // Contractor header row
      paymentData.push(['', d.contractor, `(${d.contracts.length} Claims)`]);

      // Contract rows
      d.contracts.forEach((k, idx) => {
        paymentData.push([
          idx + 1,
          k.ref || '',
          k.beforeVat || 0,
          k.retention || 0,
          k.vat || 0,
          k.subTotal || 0,
          k.whTax || 0,
          k.grandTotal || 0,
          k.paid || 0,
          (k.grandTotal || 0) - (k.paid || 0)
        ]);
      });

      // Contractor subtotals (from summarize)
      const c = perContractor.find(pc => pc.ref === d.ref);
      const cClaims = c ? c.cTotal : 0;
      const cPaid = c ? c.cPaid : 0;
      const cRemaining = c ? c.cRem : 0;

      paymentData.push(['', 'Total Claim (Grand Total)', '', '', '', '', '', cClaims]);
      paymentData.push(['', 'Contract Payment', '', '', '', '', '', cPaid]);
      paymentData.push(['', 'Total Remaining', '', '', '', '', '', cRemaining]);
      paymentData.push([]); // Empty row
    });

    const paymentWS = XLSX.utils.aoa_to_sheet(paymentData);
    paymentWS['!cols'] = [
      {wch: 12}, {wch: 28}, {wch: 15}, {wch: 15}, {wch: 12}, {wch: 15}, {wch: 12}, {wch: 15}
    ];

    // Apply currency formatting to all numeric cells
    for(let key in paymentWS) {
      if(key[0] === '!') continue; // Skip metadata keys
      const cell = paymentWS[key];
      if(cell && typeof cell.v === 'number') {
        cell.z = '#,##0.00';
      }
    }

    // ========== SHEET 2: RETENTION SUMMARY ==========
    const retentionData = [];

    // Get contractors with retention_total > 0
    const contractorsWithRetention = data.filter(d => d.retention_total > 0);
    const totalRetention = contractorsWithRetention.reduce((s,d) => s + d.retention_total, 0);
    const retentionOnlyRefs = new Set(data.filter(d => d.retention_only).map(d => d.ref));
    const retentionPaid = payments.filter(p => retentionOnlyRefs.has(p.contractorRef)).reduce((s,p) => s + p.amount, 0);

    // Row 1: Title
    retentionData.push(['', 'RETENTION SUMMARY']);

    // Row 2: Summary headers
    retentionData.push(['', 'Total Retention', 'Retention Paid', 'Outstanding']);

    // Row 3: Summary values
    retentionData.push(['', totalRetention, retentionPaid, totalRetention - retentionPaid]);

    // Row 4: Empty
    retentionData.push([]);

    // Row 5: Table headers
    retentionData.push(['No', 'Contractor', 'Retention Amount', 'Memo PDF']);

    // Row 6: Empty row
    retentionData.push([]);

    // Add contractors with retention
    contractorsWithRetention.forEach((d, idx) => {
      retentionData.push([
        idx + 1,
        d.contractor,
        d.retention_total || 0,
        d.retention_memo ? d.retention_memo.split('/').pop() : ''
      ]);
    });

    // Row: Total
    retentionData.push([]);
    retentionData.push(['', 'TOTAL RETENTION', totalRetention, '']);

    const retentionWS = XLSX.utils.aoa_to_sheet(retentionData);
    retentionWS['!cols'] = [
      {wch: 5}, {wch: 40}, {wch: 18}, {wch: 35}
    ];

    // Apply currency formatting to all numeric cells
    for(let key in retentionWS) {
      if(key[0] === '!') continue; // Skip metadata keys
      const cell = retentionWS[key];
      if(cell && typeof cell.v === 'number') {
        cell.z = '#,##0.00';
      }
    }

    // Append sheets and save
    XLSX.utils.book_append_sheet(wb, paymentWS, "Payment Received Summary");
    XLSX.utils.book_append_sheet(wb, retentionWS, "Retention Summary");
    XLSX.writeFile(wb, "ATLAS_Superclub_Dashboard.xlsx");
  };
  }

  // Load data on page load
  loadData();
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@latest/dist/xlsx.full.min.js"></script>
</body>
</html>
